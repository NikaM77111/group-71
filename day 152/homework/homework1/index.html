<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>My Bank</h1>
    <p class="user">Welcome, user</p>

<div class="inputs">
    <input type="number" id="deposit" placeholder="Deposit amount">
    <input type="number" id="withdraw" placeholder="Withdraw amount">
</div>

    <button id="submitBtn">Submit</button>

    <p class="balance" id="balanceText">
    Your balance is 0
    </p>

<p class="error" id="errorText"></p>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
