<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="inputs">
      <div class="box">
          <label>Day</label>
          <input type="number" id="day" placeholder="DD">
        </div>
        <div class="box">
          <label>Month</label>
          <input type="number" id="month" placeholder="MM">
        </div>
        <div class="box">
          <label>Year</label>
          <input type="number" id="year" placeholder="YYYY">
        </div>
    </div>
    <div class="line">
    <hr>
    <button id="btn">
        <img src="/day 176/homework/age-calculator-app-main/assets/images/icon-arrow.svg">
    </button>
</div>
  <div class="result">
    <h2><span id="years">-- </span> Years</h2>
    <h2><span id="months">-- </span> Months</h2>
    <h2><span id="days">-- </span> Days</h2>
  </div>
<p id="message"></p>
</div>
<script src="script.js"></script>
</body>
</html>
