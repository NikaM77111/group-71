<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card" id="main">
<div class="left">
  <h1>Stay updated!</h1>
  <p>Join 60,000+ product managers receiving monthly updates on:</p>
    <ul>
      <li>Product discovery and building what matters</li>
      <li>Measuring to ensure updates are a success</li>
      <li>And much more!</li>
    </ul>
    <form id="form">
      <div class="row">
        <label>Email address</label>
        <span id="error">Valid email required</span>
      </div>
      <input type="text" id="email" placeholder="email@company.com">
      <button>Subscribe to monthly newsletter</button>
    </form>
  </div>
  <img class="hero" src="./assets/images/illustration-sign-up-desktop.svg">
</div>
<div class="success hide" id="success">
  <img src="./assets/images/icon-success.svg">
  <h2>Thanks for subscribing!</h2>
<p>
    A confirmation email has been sent to
    <b id="mail"></b>
</p>
<button onclick="dismiss()">Dismiss message</button>
</div>
<script src="script.js"></script>
</body>
</html>
