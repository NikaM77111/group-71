<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Rating Component</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <div id="rating-state" class="card">
    <div class="icon">★</div>
    <h2>How did we do?</h2>
      <p>
      Please let us know how we did with your support request.
      All feedback is appreciated to help us improve our offering!
      </p>

    <div class="ratings">
      <button class="rate">1</button>
      <button class="rate">2</button>
      <button class="rate">3</button>
      <button class="rate">4</button>
      <button class="rate">5</button>
    </div>

    <button id="submit-btn">SUBMIT</button>
  </div>

  <div id="thank-state" class="card hidden">
  <img src="http://127.0.0.1:5500/day%20146/homework/interactive-rating-component-main/images/illustration-thank-you.svg" width="170">
  <br><br>

    <p id="selected-rating"></p>
    <h2>Thank you!</h2>
    <p>
      We appreciate you taking the time to give a rating.
      If you ever need more support, don’t hesitate to get in touch!
    </p>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
