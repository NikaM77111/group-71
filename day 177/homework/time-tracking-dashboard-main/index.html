<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracking Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="grid">

    <section class="profile-card">
      <div class="profile-top">
        <img src="/day 177/homework/time-tracking-dashboard-main/images/image-jeremy.png" alt="profile">
        <p>Report for</p>
        <h1>Jeremy<br>Robson</h1>
      </div>

      <div class="profile-bottom">
        <button class="tab active" data-type="daily">Daily</button>
        <button class="tab" data-type="weekly">Weekly</button>
        <button class="tab" data-type="monthly">Monthly</button>
      </div>

    </section>
    <section class="cards" id="cards"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
