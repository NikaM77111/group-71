<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">

<header class="header">
    <h1> Music App</h1>
    <p class="subtitle">Add, edit, play your favorite songs</p>
</header>

<section class="form-section">
    <div class="form-box">
    <input id="title" type="text" placeholder="Enter song title">
    <input id="artist" type="text" placeholder="Enter artist name">
    <input id="audio" type="text" placeholder="Paste audio URL (mp3)">
    <button id="addBtn">Add Music</button>
</div>
</section>

<section class="library-section">
<h2>Your Library</h2>
<div id="musicList" class="music-grid"></div>
</section>
</div>

<script src="script.js"></script>
</body>
</html>
